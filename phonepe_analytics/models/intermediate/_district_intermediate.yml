version: 2

models:
  - name: int_district_quarterly_metrics
    description: >
      One record per state, district and quarter combining transaction
      count, transaction value, users and merchants.

    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - state_slug
              - district_slug
              - year
              - quarter

      - metric_flag_consistency:
          arguments:
            flag_column: has_transaction_data
            metric_columns:
              - total_transaction_count
              - total_transaction_amount

      - metric_flag_consistency:
          arguments:
            flag_column: has_user_data
            metric_columns:
              - registered_user_count

      - metric_flag_consistency:
          arguments:
            flag_column: has_merchant_data
            metric_columns:
              - registered_merchant_count

    columns:
      - name: state_slug
        data_tests:
          - not_null

      - name: district_slug
        data_tests:
          - not_null

      - name: district_name
        data_tests:
          - not_null

      - name: year
        data_tests:
          - not_null

      - name: quarter
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4]
                quote: false

      - name: period
        data_tests:
          - not_null

      - name: period_start_date
        data_tests:
          - not_null

      - name: total_transaction_count
        description: >
          Transaction count. Null when transaction source data
          is unavailable for the district and quarter.
        data_tests:
          - positive_value

      - name: total_transaction_amount
        description: >
          Transaction value. Null when transaction source data
          is unavailable for the district and quarter.
        data_tests:
          - positive_value

      - name: registered_user_count
        data_tests:
          - not_null
          - positive_value

      - name: registered_merchant_count
        description: >
          Registered merchant count. May be null when merchant
          source data is unavailable.
        data_tests:
          - positive_value