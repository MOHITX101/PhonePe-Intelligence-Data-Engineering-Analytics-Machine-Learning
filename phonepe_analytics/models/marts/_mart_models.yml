version: 2

models:
  - name: mart_state_quarterly_performance
    description: >
      State-quarter analytical mart containing transaction, user,
      merchant, growth, intensity, completeness and ranking metrics.

    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - state_slug
              - year
              - quarter

    columns:
      - name: state_slug
        data_tests:
          - not_null

      - name: year
        data_tests:
          - not_null

      - name: quarter
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4]
                quote: false

      - name: period_start_date
        data_tests:
          - not_null

      - name: total_transaction_count
        data_tests:
          - not_null
          - positive_value

      - name: registered_user_count
        data_tests:
          - not_null
          - positive_value

      - name: registered_merchant_count
        data_tests:
          - positive_value

      - name: transaction_rank
        data_tests:
          - not_null
          - positive_value

      - name: registered_user_rank
        data_tests:
          - not_null
          - positive_value